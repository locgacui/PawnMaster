services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pawnmaster-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Snowfox123@
      - MSSQL_PID=Developer
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqlserver_data:

